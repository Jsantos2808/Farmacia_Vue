name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm test
          npm run build
      - name: Start MongoDB replica set
        run: |
          docker run --detach --name pharmacy-mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec pharmacy-mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec pharmacy-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in {1..30}; do
            if docker exec pharmacy-mongo mongosh --quiet --eval 'rs.status().myState === 1' | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not elect a primary"
          exit 1
      - name: Build backend
        run: |
          cd backend
          npm ci
          TEST_MONGODB_URI="mongodb://localhost:27017/?directConnection=true&replicaSet=rs0" npm test
          npm run build
